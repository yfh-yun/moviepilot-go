# Alertmanager 配置文件

global:
  resolve_timeout: 5m
  smtp_smarthost: 'smtp.gmail.com:587'
  smtp_from: 'alertmanager@moviepilot.com'
  smtp_auth_username: 'your-email@gmail.com'
  smtp_auth_password: 'your-password'
  smtp_require_tls: true

# 路由配置
route:
  group_by: ['alertname', 'cluster', 'service']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 12h
  receiver: 'default'
  routes:
    - match:
        severity: critical
      receiver: 'critical'
      continue: true
    
    - match:
        severity: warning
      receiver: 'warning'
      continue: true

# 接收器配置
receivers:
  - name: 'default'
    webhook_configs:
      - url: 'http://moviepilot-go:3001/api/v1/alerts/webhook'
        send_resolved: true

  - name: 'critical'
    email_configs:
      - to: 'admin@moviepilot.com'
        headers:
          Subject: '[CRITICAL] MoviePilot Alert'
        html: |
          <h2>Critical Alert</h2>
          <p><strong>Alert:</strong> {{ .GroupLabels.alertname }}</p>
          <p><strong>Severity:</strong> {{ .CommonLabels.severity }}</p>
          <p><strong>Summary:</strong> {{ .CommonAnnotations.summary }}</p>
          <p><strong>Description:</strong> {{ .CommonAnnotations.description }}</p>
    
    webhook_configs:
      - url: 'http://moviepilot-go:3001/api/v1/alerts/webhook'
        send_resolved: true
    
    # Telegram通知（如果配置）
    # telegram_configs:
    #   - bot_token: 'YOUR_BOT_TOKEN'
    #     chat_id: YOUR_CHAT_ID
    #     parse_mode: 'HTML'
    #     message: |
    #       🚨 <b>Critical Alert</b>
    #       Alert: {{ .GroupLabels.alertname }}
    #       Severity: {{ .CommonLabels.severity }}
    #       Summary: {{ .CommonAnnotations.summary }}

  - name: 'warning'
    email_configs:
      - to: 'team@moviepilot.com'
        headers:
          Subject: '[WARNING] MoviePilot Alert'
        html: |
          <h2>Warning Alert</h2>
          <p><strong>Alert:</strong> {{ .GroupLabels.alertname }}</p>
          <p><strong>Severity:</strong> {{ .CommonLabels.severity }}</p>
          <p><strong>Summary:</strong> {{ .CommonAnnotations.summary }}</p>
    
    webhook_configs:
      - url: 'http://moviepilot-go:3001/api/v1/alerts/webhook'
        send_resolved: true

# 抑制规则
inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'instance']
