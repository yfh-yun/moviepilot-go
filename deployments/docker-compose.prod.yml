version: '3.8'

services:
  # PostgreSQL数据库
  postgres:
    image: postgres:15-alpine
    container_name: moviepilot-postgres-prod
    environment:
      POSTGRES_DB: ${DB_NAME:-moviepilot}
      POSTGRES_USER: ${DB_USER:-moviepilot}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
      - ./init/postgres:/docker-entrypoint-initdb.d
    networks:
      - moviepilot-prod-network
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Redis缓存
  redis:
    image: redis:7-alpine
    container_name: moviepilot-redis-prod
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_prod_data:/data
    networks:
      - moviepilot-prod-network
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Go主应用
  moviepilot-go:
    image: moviepilot-go:${VERSION:-latest}
    container_name: moviepilot-go-prod
    environment:
      - GIN_MODE=release
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-moviepilot}
      - DB_USER=${DB_USER:-moviepilot}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - LOG_LEVEL=${LOG_LEVEL:-warn}
      - SERVER_PORT=3001
      - JWT_SECRET=${JWT_SECRET}
      - API_KEY=${API_KEY}
    volumes:
      - ./configs:/app/configs:ro
      - ../logs:/app/logs
      - ../data:/app/data
    ports:
      - "${SERVER_PORT:-3001}:3001"
    depends_on:
      - postgres
      - redis
    networks:
      - moviepilot-prod-network
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Python插件服务
  python-plugins:
    image: moviepilot-python-plugins:${VERSION:-latest}
    container_name: moviepilot-python-plugins-prod
    environment:
      - GRPC_SERVER_PORT=5000
      - GO_SERVER_HOST=moviepilot-go
      - GO_SERVER_PORT=3001
      - LOG_LEVEL=${LOG_LEVEL:-warn}
    volumes:
      - ../../python-plugins/plugins:/app/plugins:ro
      - ../../python-plugins/logs:/app/logs
    depends_on:
      - moviepilot-go
    networks:
      - moviepilot-prod-network
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Nginx反向代理
  nginx:
    image: nginx:alpine
    container_name: moviepilot-nginx-prod
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ../logs/nginx:/var/log/nginx
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - moviepilot-go
    networks:
      - moviepilot-prod-network
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_prod_data:
    driver: local
  redis_prod_data:
    driver: local

networks:
  moviepilot-prod-network:
    driver: bridge