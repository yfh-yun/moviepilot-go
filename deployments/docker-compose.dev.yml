version: '3.8'

services:
  # PostgreSQL数据库
  postgres:
    image: postgres:15-alpine
    container_name: moviepilot-postgres-dev
    environment:
      POSTGRES_DB: moviepilot_dev
      POSTGRES_USER: moviepilot
      POSTGRES_PASSWORD: moviepilot123
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
      - ./init/postgres:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    networks:
      - moviepilot-dev-network
    restart: unless-stopped

  # Redis缓存
  redis:
    image: redis:7-alpine
    container_name: moviepilot-redis-dev
    command: redis-server --appendonly yes --requirepass redis123
    volumes:
      - redis_dev_data:/data
    ports:
      - "6379:6379"
    networks:
      - moviepilot-dev-network
    restart: unless-stopped

  # 开发工具 - pgAdmin
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: moviepilot-pgadmin-dev
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@moviepilot.com
      PGADMIN_DEFAULT_PASSWORD: admin123
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    ports:
      - "8080:80"
    networks:
      - moviepilot-dev-network
    restart: unless-stopped

  # 开发工具 - Redis Commander
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: moviepilot-redis-commander-dev
    environment:
      REDIS_HOSTS: local:redis:6379:0:redis123
      HTTP_USER: admin
      HTTP_PASSWORD: admin123
    ports:
      - "8081:8081"
    networks:
      - moviepilot-dev-network
    restart: unless-stopped
    depends_on:
      - redis

volumes:
  postgres_dev_data:
    driver: local
  redis_dev_data:
    driver: local
  pgadmin_data:
    driver: local

networks:
  moviepilot-dev-network:
    driver: bridge