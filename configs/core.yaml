# MoviePilot Go 核心配置

# 应用配置
app:
  name: "moviepilot-go"
  version: "1.0.0"
  environment: "development"
  debug: true

# 服务器配置
server:
  host: "0.0.0.0"
  port: 3001
  read_timeout: 30s
  write_timeout: 30s
  idle_timeout: 60s

# 数据库配置
database:
  type: "postgres"
  host: "localhost"
  port: 5432
  name: "moviepilot"
  user: "moviepilot"
  password: "moviepilot"
  ssl_mode: "disable"
  max_open_conns: 25
  max_idle_conns: 5
  conn_max_lifetime: 300s

# Redis 配置
redis:
  host: "localhost"
  port: 6379
  password: ""
  db: 0
  pool_size: 10
  min_idle_conns: 3

# 日志配置
logger:
  level: "info"
  format: "json"
  output: "stdout"
  file_path: "/var/log/moviepilot/app.log"
  max_size: 100
  max_backups: 3
  max_age: 28
  compress: true

# 认证配置
auth:
  jwt_secret: "your-secret-key-change-in-production"
  jwt_expiry: "24h"
  api_key_header: "X-API-Key"
  api_keys:
    - "development-api-key"

# 限流配置
rate_limit:
  enabled: true
  requests_per_minute: 60
  burst: 10
  api_requests_per_minute: 120
  api_burst: 20

# 文件存储配置
storage:
  download_path: "/downloads"
  library_path: "/library"
  temp_path: "/tmp"
  max_file_size: "50GB"

# TMDB 配置
tmdb:
  api_key: "your-tmdb-api-key"
  language: "zh-CN"
  include_adult: false
  timeout: 30s

# 工作流配置
workflow:
  max_concurrent_workflows: 5
  task_timeout: 300s
  retry_attempts: 3
  retry_delay: 5s

# 监控配置
monitoring:
  enabled: true
  prometheus:
    enabled: true
    port: 9090
    path: "/metrics"
  health_check:
    enabled: true
    port: 3002
    path: "/health"

# 插件配置
plugins:
  enabled: true
  python_service:
    host: "localhost"
    port: 5000
    timeout: 30s
  directories:
    - "./plugins/go"
    - "./plugins/python"