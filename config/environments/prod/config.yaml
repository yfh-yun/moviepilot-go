# 生产环境配置
app:
  name: "MoviePilot-Go"
  version: "2.8.1"
  env: "production"
  debug: false

server:
  host: "0.0.0.0"
  port: 3001
  timeout: 30s

database:
  type: "postgres"
  connection: "postgres://user:password@localhost:5432/moviepilot?sslmode=disable"
  max_connections: 20
  log_level: "error"

redis:
  host: "redis-cluster"
  port: 6379
  db: 0
  password: "${REDIS_PASSWORD}"

logging:
  level: "warn"
  format: "json"
  output: "/var/log/moviepilot/app.log"
