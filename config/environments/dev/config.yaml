# 开发环境配置
app:
  name: "MoviePilot-Go"
  version: "2.8.1"
  env: "development"
  debug: true

server:
  host: "0.0.0.0"
  port: 3001
  timeout: 30s

database:
  type: "sqlite"
  connection: "./data/moviepilot-dev.db"
  max_connections: 10
  log_level: "debug"

redis:
  host: "localhost"
  port: 6379
  db: 0
  password: ""

logging:
  level: "debug"
  format: "console"
  output: "stdout"
