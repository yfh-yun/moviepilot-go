syntax = "proto3";

package plugin;

option go_package = "moviepilot/shared/proto";

// Plugin service definition
service PluginService {
  // Get plugin list
  rpc GetPlugins(GetPluginsRequest) returns (GetPluginsResponse);
  
  // Get plugin by ID
  rpc GetPlugin(GetPluginRequest) returns (GetPluginResponse);
  
  // Install plugin
  rpc InstallPlugin(InstallPluginRequest) returns (InstallPluginResponse);
  
  // Uninstall plugin
  rpc UninstallPlugin(UninstallPluginRequest) returns (UninstallPluginResponse);
  
  // Enable plugin
  rpc EnablePlugin(EnablePluginRequest) returns (EnablePluginResponse);
  
  // Disable plugin
  rpc DisablePlugin(DisablePluginRequest) returns (DisablePluginResponse);
  
  // Get plugin status
  rpc GetPluginStatus(GetPluginStatusRequest) returns (GetPluginStatusResponse);
}

// Plugin information
message Plugin {
  string id = 1;
  string name = 2;
  string version = 3;
  string description = 4;
  string author = 5;
  string type = 6;
  bool enabled = 7;
  bool installed = 8;
  map<string, string> config = 9;
  repeated string dependencies = 10;
}

// Request and response messages
message GetPluginsRequest {
  string type = 1;
  bool enabled_only = 2;
}

message GetPluginsResponse {
  repeated Plugin plugins = 1;
}

message GetPluginRequest {
  string id = 1;
}

message GetPluginResponse {
  Plugin plugin = 1;
}

message InstallPluginRequest {
  string id = 1;
  string version = 2;
  map<string, string> config = 3;
}

message InstallPluginResponse {
  bool success = 1;
  string message = 2;
}

message UninstallPluginRequest {
  string id = 1;
}

message UninstallPluginResponse {
  bool success = 1;
  string message = 2;
}

message EnablePluginRequest {
  string id = 1;
}

message EnablePluginResponse {
  bool success = 1;
  string message = 2;
}

message DisablePluginRequest {
  string id = 1;
}

message DisablePluginResponse {
  bool success = 1;
  string message = 2;
}

message GetPluginStatusRequest {
  string id = 1;
}

message GetPluginStatusResponse {
  string status = 1;
  map<string, string> metrics = 2;
}